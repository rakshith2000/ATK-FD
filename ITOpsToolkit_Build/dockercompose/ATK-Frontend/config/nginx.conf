# =============================================================================
# ATK — FRONTEND machine nginx (10.106.6.228)
#
# Serves one DNS record:
#   atkdev.fd.com  ->  /      Frontend (React, npm start on :80)
#                      /v2/   Admin Console (static build behind its own nginx)
#
# There are NO /api, /auth, /grafana or /litellm locations here. Those live on
# the core machine (10.106.6.15) under their own DNS names and the browser
# calls them directly:
#   https://backend-atkdev.fd.com/api       (+ /grafana, /litellm)
#   https://sso-atkdev.fd.com/auth
#   https://vault-atkdev.fd.com
#
# TLS: the same wildcard *.fd.com certificate used on the core machine, placed
#      in ssl/fullchain.pem + ssl/privkey.pem.
# =============================================================================

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    client_max_body_size 50m;

    # Docker's embedded DNS — lets proxy_pass use variables so nginx starts even
    # if an upstream container is not up yet.
    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # $connection_upgrade: "upgrade" for WebSocket requests, "close" otherwise.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── HTTP → HTTPS redirect ──────────────────────────────────────────────────
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── Unknown Host on 443 → 404 ──────────────────────────────────────────────
    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        return 404;
    }

    # =========================================================================
    # FRONTEND + ADMIN CONSOLE — https://atkdev.fd.com
    # =========================================================================

    server {
        listen 443 ssl;
        server_name atkdev.fd.com;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # ── Admin Console ───────────────────────────────────────────────────────
        # Built with VITE_APP_BASE_PATH=/v2/, so it expects the /v2 prefix.
        # The inner nginx (config/nginx-v2.conf) strips it before hitting disk.
        # This also serves the micro-frontend remote entry that the main
        # frontend imports:
        #   /v2/itops-mfe/itops-mfe-remote-entry.js
        location = /v2 {
            return 301 https://$host/v2/;
        }
        location /v2/ {
            set $upstream_admin admin-frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://$upstream_admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 30s;
            proxy_send_timeout    450s;
            proxy_read_timeout    450s;
        }

        # ── Frontend catch-all ──────────────────────────────────────────────────
        location / {
            set $upstream_frontend frontend:80;
            proxy_http_version 1.1;
            proxy_pass http://$upstream_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            # The frontend runs the CRA dev server, which uses a WebSocket for
            # hot reload — without the upgrade headers the browser console fills
            # with failed /ws connections.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 30s;
            proxy_send_timeout    450s;
            proxy_read_timeout    450s;
        }
    }
}
