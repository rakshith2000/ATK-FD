events {}
http {
    include       mime.types;
    default_type  application/octet-stream;
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location = /v2 {
            return 301 /v2/;
        }
        location ~* ^/v2/assets/ {
            rewrite ^/v2/(.*)$ /$1 break;
            try_files $uri =404;
        }

        location /v2/ {
            rewrite ^/v2/(.*)$ /$1 break;
            try_files $uri $uri/ /index.html;
        }
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
