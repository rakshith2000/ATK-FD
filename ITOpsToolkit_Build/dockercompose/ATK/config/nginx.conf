worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    client_max_body_size 50m;

    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;

    # ── HTTP → HTTPS redirect ──────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── Main HTTPS server ───────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # ── Keycloak ────────────────────────────────────────────────────────────
        location /auth/ {
            set $upstream_keycloak keycloak:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://$upstream_keycloak;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 30s;
            proxy_send_timeout    450s;
            proxy_read_timeout    450s;
        }

        # ── LiteLLM ─────────────────────────────────────────────────────────────
        location /litellm/ {
            set $upstream_litellm litellm:4000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://$upstream_litellm;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 30s;
            proxy_send_timeout    450s;
            proxy_read_timeout    450s;
        }

        # ── Grafana ─────────────────────────────────────────────────────────────
        location /grafana/ {
            set $upstream_grafana grafana:3000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://$upstream_grafana;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 30s;
            proxy_send_timeout    450s;
            proxy_read_timeout    450s;
        }

        # ── Backend API ─────────────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ── IAC WebSocket ───────────────────────────────────────────────────────
        location /iac_assist_socket/ {
            set $upstream_backend_ws backend:8000;
            proxy_http_version 1.1;
            proxy_pass http://$upstream_backend_ws;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Admin Frontend ──────────────────────────────────────────────────────
        location /v2/ {
            set $upstream_admin admin-frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://$upstream_admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 30s;
            proxy_send_timeout    450s;
            proxy_read_timeout    450s;
        }

        # ── FastAPI Swagger UI ──────────────────────────────────────────────────
        location = /openapi.json {
            set $upstream_backend backend:8000;
            proxy_pass http://$upstream_backend/openapi.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ── Frontend catch-all ──────────────────────────────────────────────────
        location / {
            set $upstream_frontend frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://$upstream_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 30s;
            proxy_send_timeout    450s;
            proxy_read_timeout    450s;
        }
    }

    # ── Vault — dedicated HTTPS on port 8443 ─────────────────────────────────
    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        location / {
            set $upstream_vault vault:8200;
            proxy_http_version 1.1;
            proxy_pass http://$upstream_vault;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 30s;
            proxy_send_timeout    450s;
            proxy_read_timeout    450s;
        }
    }
}
