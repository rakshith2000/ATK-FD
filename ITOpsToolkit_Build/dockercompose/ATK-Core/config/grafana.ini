[server]
serve_from_sub_path = true
root_url = https://backend-atkdev.fd.com/grafana

[security]
admin_user = admin
admin_password = <Grafana Admin Password>

# The frontend (https://atkdev.fd.com) is a different origin from Grafana
# (https://backend-atkdev.fd.com). These three settings let it embed Grafana
# panels in an iframe and keep the Grafana session cookie working cross-site.
allow_embedding = true
cookie_samesite = none
cookie_secure = true
