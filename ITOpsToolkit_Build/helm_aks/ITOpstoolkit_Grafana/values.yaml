replicaCount: 1

##########The Below Section is For Volume mounts ###############
configMaps:
  - name: grafana
    destinationPath: /etc/grafana/grafana.ini
    fileName: grafana.ini
  # Additional files can be mounted by adding entries in the format above
  


image:
  repository: <ACR ARN>/<Repo>
  pullPolicy: Always
  tag: "<image-tag>"
  
#############For AGIC use###############
ingress:
  className: "azure-application-gateway"
  annotations:
    appgw.ingress.kubernetes.io/backend-protocol: "http"
    appgw.ingress.kubernetes.io/health-probe-status-codes: "200-399"
    appgw.ingress.kubernetes.io/health-probe-port: "<port>" #3000
    appgw.ingress.kubernetes.io/health-probe-path: "/grafana"
    appgw.ingress.kubernetes.io/ssl-redirect: "true"
    #appgw.ingress.kubernetes.io/cookie-based-affinity: "true"
########################################    

######For Nginx Ingress Controller######## Uncomment when needed
#ingress:
#className: "nginx"
#annotations: {}
##########################################

service:
  type: ClusterIP
  port: <Port> #3000
  targetPort: <Port> #3000
  
nameOverride: "itops-grafana"
fullnameOverride: "itops-platform-itops-grafana"

nodeSelector:
  <label-key>: <label-value>
  
host:
  name: "<DNS Name>" #without https

# Below secret is for SSL certtificates. Remove this if its not needed 
secret:
  name: "<K8s secret name>"

# Uncomment this only if the image is getting pulled from JFrog directly via helms 
# jfrogSecret:
#   name: <secret-name>


resources:
  limits:
    cpu: 1500m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

#Probes can be disabled by setting 'false' for the below fields
probes:
  liveness:
    enabled: true
    path: /api/health
  readiness:
    enabled: true
    path: /api/health
    
env:
  - name: GF_SECURITY_ADMIN_USER
    value: "<Admin UserName>"
  - name: GF_SECURITY_ADMIN_PASSWORD
    value: "<Admin Password>"
  - name: GF_SERVER_SERVE_FROM_SUB_PATH
    value: "true"
  - name: GF_SERVER_ROOT_URL
    value: "<DNS>/grafana" #https

