[server]
domain = <DNS Name> #without https
root_url = <DNS Name>/grafana
serve_from_sub_path = true

[security]
cookie_secure = true
secret_key = <32char-random-string> #Run this command to get the value -> openssl rand -hex 32

[auth]
signout_redirect_url = <Keycloak-URL>/realms/<REALM>/protocol/openid-connect/logout?post_logout_redirect_uri=<Grafana URL>  #Here, for Grafana URL , update in this format-> https%3A%2F%2F<DNS_Name>%2Fgrafana (if you are using https://<DNS>/grafana as the URL ) 
[auth.generic_oauth]
name = Keycloak-OAuth
icon = signin
enabled = true
allow_sign_up = true
auto_login = false
client_id = <Client Name>
client_secret = <Client Secret>
auth_url = <Keycloak-URL>/realms/<REALM>/protocol/openid-connect/auth
token_url = <Keycloak-URL>/realms/<REALM>/protocol/openid-connect/token
api_url = <Keycloak-URL>/realms/<REALM>/protocol/openid-connect/userinfo
scopes = openid email profile


[log]
mode = console
level = info
