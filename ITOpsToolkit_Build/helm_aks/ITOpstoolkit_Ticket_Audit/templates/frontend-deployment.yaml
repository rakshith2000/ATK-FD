apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-audit-frontend
  namespace: {{ .Values.namespace }}
  labels:
    app: ticket-audit-frontend
    {{- include "ticket-audit.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: ticket-audit-frontend
  template:
    metadata:
      labels:
        app: ticket-audit-frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.image.registry }}/{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: ticket-audit-config
            - secretRef:
                name: ticket-audit-secret
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
