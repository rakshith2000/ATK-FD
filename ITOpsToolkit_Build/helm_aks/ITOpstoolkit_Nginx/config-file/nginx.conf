worker_processes 1;
 
events {
    worker_connections 1024;
}
 
http {
    include  mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server {
        listen 443 ssl;
        server_name <DNS Name>;
 
        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;

        ## Comment the respective blocks if the component is not needed
 
        # ===== FRONTEND =====
        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
 
            proxy_pass http://<frontend service name>.<namespace>.svc.cluster.local:<frontend-service-port>;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
 
            proxy_connect_timeout 30s;
            proxy_send_timeout 450s;
            proxy_read_timeout 450s;
            send_timeout 450s;
        }
 
        # ===== BACKEND =====
        location /api/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
 
            proxy_pass http://<backend service name>.<namespace>.svc.cluster.local:<backend-service-port>;
            proxy_set_header Host $host;
