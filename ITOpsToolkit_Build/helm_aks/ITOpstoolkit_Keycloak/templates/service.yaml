apiVersion: v1
kind: Service
metadata:
  name: {{ include "itops-keycloak.fullname" . }}
  labels:
    {{- include "itops-keycloak.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "itops-keycloak.selectorLabels" . | nindent 4 }}
