apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "itops-keycloak.fullname" . }}
  labels:
    {{- include "itops-keycloak.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "itops-keycloak.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "itops-keycloak.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.jfrogSecret }}
      imagePullSecrets:
        - name: {{ .Values.jfrogSecret.name }}
      {{- end }}
      containers:
        - name: {{ include "itops-keycloak.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - start
            - --optimized
            - --hostname-strict=false
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: {{ .Values.service.readinessPort }}
            periodSeconds: 10
            failureThreshold: 30
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.service.readinessPort }}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.service.readinessPort }}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          {{- end }}
          env:
            {{- toYaml .Values.env | nindent 12 }}
          {{- if .Values.copyFiles }}
          volumeMounts:
            {{- range .Values.copyFiles }}
            - name: {{ .name }}
              mountPath: {{ .destinationPath }}
              subPath: {{ .fileName }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.copyFiles }}
      volumes:
        {{- range .Values.copyFiles }}
        - name: {{ .name }}
          configMap:
            name: {{ .name }}
        {{- end }}
      {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}