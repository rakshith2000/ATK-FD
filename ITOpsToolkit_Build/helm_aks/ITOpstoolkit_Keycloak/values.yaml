image:
  repository: <ACR ARN>/<repo name>
  pullPolicy: Always
  tag: "<Tag>"

##Below is for AGIC use##
ingress:
  className: "azure-application-gateway"
  annotations:
    appgw.ingress.kubernetes.io/backend-protocol: "http"
    appgw.ingress.kubernetes.io/health-probe-status-codes: "200-399"
    appgw.ingress.kubernetes.io/health-probe-port: "<port>" #8080
    appgw.ingress.kubernetes.io/health-probe-path: "/auth"
    appgw.ingress.kubernetes.io/ssl-redirect: "true"
    #appgw.ingress.kubernetes.io/cookie-based-affinity: "true"    
##########################    

######For Nginx Ingress Controller######## Uncomment when needed
#ingress:
#className: "nginx"
#annotations: {}
##########################################

nameOverride: "itops-keycloak"
fullnameOverride: "itops-platform-itops-keycloak"

# you can comment the nodeSelector if its not used(Keycloak should be built on the node where frontend should be built)
nodeSelector:
  <label-key>: <label-value>

service:
  type: ClusterIP
  port: <Keycloak port> #8080
  targetPort: <Keycloak port> #8080
  readinessPort: 9000

host:
  name: "<DNS Name>" # without DNS

# Below secret is for SSL certtificates. Remove this if its not needed 
secret:
  name: "<K8s secret name>"

# Uncomment this only if the image is getting pulled from JFrog directly via helms 
# jfrogSecret:
#   name: <secret-name>

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

#Probes can be disabled by setting 'false' for the below fields
probes:
  startup:
    enabled: true
    path: /auth/health/started
  liveness:
    enabled: true
    path: /auth/health/live
  readiness:
    enabled: true
    path: /auth/health/ready
    port: health
env:
  - name: KEYCLOAK_ADMIN
    value: "<Admin Name>"
  - name: KEYCLOAK_ADMIN_PASSWORD
    value: "<Admin Password>"
  - name: KC_FEATURES
    value: "token-exchange"
  - name: KC_PROXY_HEADERS
    value: "xforwarded"
  - name: KC_HOSTNAME_STRICT
    value: "false"
  - name: KC_DB
    value: "postgres"
  - name: KC_DB_URL
    value: "jdbc:postgresql://<DB URL>:5432/<Keycloak DB Name>?sslmode=require"
  - name: KC_DB_USERNAME
    value: "<kecloak DB username>" 
  - name: KC_DB_PASSWORD
    value: "<kecloak DB password>"
  - name: KC_HOSTNAME
    value: "<DNS Name>" # https://<DNS>/auth
  - name: KC_HTTP_RELATIVE_PATH
    value: "<URL relative path>" #/auth
  - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
    value: "false"
  - name: KC_HEALTH_ENABLED
    value: "true"
