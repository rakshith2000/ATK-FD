apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
type: Opaque
stringData:
  .keycloak_env: |
    KEYCLOAK_URL={{ .Values.keycloak_secrets.KEYCLOAK_URL }}
    KEYCLOAK_REDIRECTION_URL={{ .Values.keycloak_secrets.KEYCLOAK_REDIRECTION_URL }}
    REALM_NAME={{ .Values.keycloak_secrets.REALM_NAME }}
    CLIENT_ID={{ .Values.keycloak_secrets.CLIENT_ID }}
    CLIENT_SECRET={{ .Values.keycloak_secrets.CLIENT_SECRET }}
    SA_CLIENT_ID={{ .Values.keycloak_secrets.SA_CLIENT_ID }}
    SA_CLIENT_SECRET={{ .Values.keycloak_secrets.SA_CLIENT_SECRET }}
