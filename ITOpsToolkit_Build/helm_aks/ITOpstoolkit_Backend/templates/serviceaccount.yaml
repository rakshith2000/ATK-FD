{{- if .Values.serviceAccount }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name:  {{ .Values.serviceAccount.name }}
  labels:
    app.kubernetes.io/name: {{ include "itops-backend.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    azure.workload.identity/use: "true"
    {{- include "itops-backend.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
