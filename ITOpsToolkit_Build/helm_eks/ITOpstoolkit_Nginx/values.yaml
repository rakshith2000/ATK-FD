replicaCount: 1
 
image:
  repository: <ECR image repo uri>
  tag: "<Image tag>"
  pullPolicy: Always

nameOverride: "itops-nginx"
fullnameOverride: "itops-platform-itops-nginx"
 
service:
  type: LoadBalancer
  port: <> #443
  targetPort: <> #443
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme:  "internal" #"internet-facing" for internet facing
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
  
 
nodeSelector:
  <node label name>: "<node label value>"
 
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi
 
# Below secret is for SSL certtificates. Remove this if its not needed 
secret:
  name: "<K8s secret name>"

# Uncomment this only if the image is getting pulled from JFrog directly via helms 
# jfrogSecret:
#   name: <secret-name>

