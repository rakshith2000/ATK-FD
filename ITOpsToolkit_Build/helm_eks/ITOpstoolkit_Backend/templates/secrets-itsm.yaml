apiVersion: v1
kind: Secret
metadata:
  name: itsm-secret
type: Opaque
stringData:
  .itsm_env: |
    ITSM_TAG={{ .Values.itsm_secrets.ITSM_TAG }}
    ITSM_TYPE={{ .Values.itsm_secrets.ITSM_TYPE }}
    ITSM_AUTH_TYPE={{ .Values.itsm_secrets.ITSM_AUTH_TYPE }}
    ITSM_URL={{ .Values.itsm_secrets.ITSM_URL }}
    ITSM_USER={{ .Values.itsm_secrets.ITSM_USER }}
    ITSM_PASSWORD={{ .Values.itsm_secrets.ITSM_PASSWORD }}
    BEARER_TOKEN={{ .Values.itsm_secrets.BEARER_TOKEN }}
