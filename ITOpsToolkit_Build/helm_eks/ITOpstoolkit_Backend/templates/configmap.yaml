apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "itops-backend.fullname" . }}-config
data:
  DB_HOST: {{ .Values.config.PGDB_HOST | quote }}
  DB_NAME: {{ .Values.config.PGDB_NAME | quote }}
  DB_PORT: {{ .Values.config.PGDB_PORT | quote }}
  PROACTIVE_PROBLEM_ANALYSIS_DAYS: {{ .Values.config.PROACTIVE_PROBLEM_ANALYSIS_DAYS | quote }}
  APP_TYPE: {{ .Values.config.APP_TYPE | quote }}
  SA_CLIENT_ID: {{ .Values.config.SA_CLIENT_ID | quote }}
  MIM_APP_PORT: {{ .Values.config.MIM_APP_PORT | quote }}
  AGENT_GATEWAY_URL: {{ .Values.config.AGENT_GATEWAY_URL | quote }}
  TWILIO_PHONE_NUMBER_FROM: {{ .Values.config.TWILIO_PHONE_NUMBER_FROM | quote }}