apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "itops-agent-gateway-ui.fullname" . }}
  labels:
    {{- include "itops-agent-gateway-ui.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      {{- include "itops-agent-gateway-ui.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "itops-agent-gateway-ui.selectorLabels" . | nindent 8 }}

    spec:
      {{- if .Values.jfrogSecret }}
      imagePullSecrets:
        - name: {{ .Values.jfrogSecret.name }}
      {{- end }}

      containers:
        - name: {{ include "itops-agent-gateway-ui.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            {{- range .Values.service.ports }}
            - name: {{ .name }}
              containerPort: {{ .targetPort }}
            {{- end }}

          env:
            {{- toYaml .Values.env | nindent 12 }}

          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            tcpSocket:
              port: 19000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          {{- end }}

          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            tcpSocket:
              port: 19000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
