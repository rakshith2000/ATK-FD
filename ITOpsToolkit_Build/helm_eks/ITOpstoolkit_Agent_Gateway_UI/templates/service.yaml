apiVersion: v1
kind: Service

metadata:
  name: {{ include "itops-agent-gateway-ui.fullname" . }}
  labels:
    {{- include "itops-agent-gateway-ui.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}

  ports:
    {{- range .Values.service.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .targetPort }}
      protocol: TCP
    {{- end }}

  selector:
    {{- include "itops-agent-gateway-ui.selectorLabels" . | nindent 4 }}
