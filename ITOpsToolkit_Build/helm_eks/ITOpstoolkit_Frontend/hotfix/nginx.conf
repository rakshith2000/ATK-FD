
events {}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # React routing
        location / {
            try_files $uri /index.html;
        }

        # Static assets
        location /static/ {
            expires 1y;
            add_header Cache-Control "public";
        }

        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
