{{- if .Values.ingress }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "itops-frontend.fullname" . }}-ingress
  labels:
    externaldns-enabled: "true"
  {{- if .Values.ingress.annotations }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.secret }}
  tls:
    - hosts:
        - {{ .Values.host.name }}
      secretName: {{ .Values.secret.name }}
  {{- end }}
  rules:
    - host: {{ .Values.host.name }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "itops-frontend.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}                  
