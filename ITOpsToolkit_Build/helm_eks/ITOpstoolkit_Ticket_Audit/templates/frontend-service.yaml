apiVersion: v1
kind: Service
metadata:
  name: ticket-audit-frontend
  namespace: {{ .Values.namespace }}
  labels:
    app: ticket-audit-frontend
    {{- include "ticket-audit.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: ticket-audit-frontend
