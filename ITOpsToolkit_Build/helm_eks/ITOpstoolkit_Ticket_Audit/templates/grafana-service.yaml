apiVersion: v1
kind: Service
metadata:
  name: ticket-audit-grafana
  namespace: {{ .Values.namespace }}
  labels:
    app: ticket-audit-grafana
    {{- include "ticket-audit.labels" . | nindent 4 }}
spec:
  type: {{ .Values.grafana.service.type }}
  ports:
    - port: {{ .Values.grafana.service.port }}
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: ticket-audit-grafana
