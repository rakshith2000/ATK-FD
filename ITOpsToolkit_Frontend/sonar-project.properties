# SonarQube properties

# Note for Quality Gate admins:
# typescript:S6747 Unknown property 'css' - this is expected as we are using a custom plugin (@/emotion/react) for CSS [CSS in js]. 
# This is a known issue with default Quality Profiles (Sonar Way).
# Please whitelist this css attribute in your SonarQube Quality Profile Rule ID: typescript:S6747.

sonar.projectKey=itops-toolkit-ui
sonar.projectName=itops-toolkit-ui
sonar.projectVersion=1.0

sonar.sources=src
sonar.tests=src

sonar.javascript.eslint.reportPaths=.eslint/eslint-report.json
sonar.typescript.eslint.reportPaths=.eslint/eslint-report.json

sonar.typescript.lcov.reportPaths=coverage/lcov.info

sonar.test.inclusions=src/**/__tests__/*.test.ts,src/**/__tests__/*.test.tsx
sonar.exclusions=src/**/*.d.ts,src/modules/dev-temp-space/**,src/routes/_app/dev-temp-space.tsx,src\routeTree.gen.ts

# cognitive-complexity
sonar.cognitive-complexity.threshold=100
sonar.cognitive-complexity.weight=0.5

sonar.issue.ignore.multicriteria=e1,e2

# e1 - Ignore S6747 rule for all files to ignore false positives related to 'css' property
# Note: if css is whitelisted in Quality Profile, this exclusion can be removed
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S6747
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*

# e2 - Suppress "use dataset instead of getAttribute" for data attributes
# getAttribute is used intentionally for closest() element lookups
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S6647
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.ts,**/*.tsx

sonar.sourceEncoding=UTF-8
sonar.host.url=
sonar.token=