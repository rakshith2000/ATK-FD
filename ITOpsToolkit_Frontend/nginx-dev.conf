worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # HTTP SERVER (PORT 80)
    server {
        listen 80 default_server;
        server_name _;

        # OLD APP (ROOT)
        root C:/Users/dev-itops/Desktop/Development/IPR001380_ITOpsToolkit/ITOpsToolkit_Frontend/build;
        index index.html index.htm;

        # NEW APP (/v2/)
        location /v2/ {
            alias C:/Users/dev-itops/Desktop/Development/ITOps_Toolkit_Frontend_Revamp/itops-toolkit-frontend/dist/;

            index index.html;

            # React routing fallback
            try_files $uri $uri/ /v2/index.html;
        }

        # MFE REMOTE ENTRY
        location = /v2/itops-mfe/itops-mfe-remote-entry.js {
            alias C:/Users/dev-itops/Desktop/Development/ITOps_Toolkit_Frontend_Revamp/itops-toolkit-frontend/dist/itops-mfe/itops-mfe-remote-entry.js;

            expires 5m;
            add_header Cache-Control "public, must-revalidate" always;

            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization" always;

            if ($request_method = OPTIONS) {
                add_header Content-Length 0;
                return 204;
            }
        }

        # MFE ASSETS (FIXED - NO REGEX)
        location /v2/itops-mfe/assets/ {
            alias C:/Users/dev-itops/Desktop/Development/ITOps_Toolkit_Frontend_Revamp/itops-toolkit-frontend/dist/itops-mfe/assets/;

            try_files $uri =404;

            expires 1y;
            add_header Cache-Control "public, immutable" always;

            add_header Access-Control-Allow-Origin * always;
        }

        # MFE BASE PATH
        location /v2/itops-mfe/ {
            alias C:/Users/dev-itops/Desktop/Development/ITOps_Toolkit_Frontend_Revamp/itops-toolkit-frontend/dist/itops-mfe/;

            try_files $uri $uri/ =404;

            add_header Access-Control-Allow-Origin * always;

            if ($request_method = OPTIONS) {
                add_header Content-Length 0;
                return 204;
            }
        }

        # OLD APP ROUTING
        location / {
            try_files $uri /index.html;
        }

        location /static/ {
            expires 1y;
            add_header Cache-Control "public";
        }

        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root html;
        }
    }

    # HTTPS SERVER (PORT 443)
    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate "C:/Users/dev-itops/Desktop/Development/ITOps_Toolkit_Frontend_Revamp/itops-toolkit-frontend/ssl_certs/cert.pem";
        ssl_certificate_key "C:/Users/dev-itops/Desktop/Development/ITOps_Toolkit_Frontend_Revamp/itops-toolkit-frontend/ssl_certs/cert.key";

        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout 5m;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # OLD APP
        root C:/Users/dev-itops/Desktop/Development/IPR001380_ITOpsToolkit/ITOpsToolkit_Frontend/build;
        index index.html index.htm;

        # NEW APP (/v2/)
        location /v2/ {
            alias C:/Users/dev-itops/Desktop/Development/ITOps_Toolkit_Frontend_Revamp/itops-toolkit-frontend/dist/;

            index index.html;

            try_files $uri $uri/ /v2/index.html;
        }

        # MFE REMOTE ENTRY
        location = /v2/itops-mfe/itops-mfe-remote-entry.js {
            alias C:/Users/dev-itops/Desktop/Development/ITOps_Toolkit_Frontend_Revamp/itops-toolkit-frontend/dist/itops-mfe/itops-mfe-remote-entry.js;

            expires 5m;
            add_header Cache-Control "public, must-revalidate" always;
            add_header Access-Control-Allow-Origin * always;
        }

        # MFE ASSETS
        location /v2/itops-mfe/assets/ {
            alias C:/Users/dev-itops/Desktop/Development/ITOps_Toolkit_Frontend_Revamp/itops-toolkit-frontend/dist/itops-mfe/assets/;

            try_files $uri =404;

            expires 1y;
            add_header Cache-Control "public, immutable" always;
            add_header Access-Control-Allow-Origin * always;
        }

        # MFE BASE PATH
        location /v2/itops-mfe/ {
            alias C:/Users/dev-itops/Desktop/Development/ITOps_Toolkit_Frontend_Revamp/itops-toolkit-frontend/dist/itops-mfe/;

            try_files $uri $uri/ =404;

            add_header Access-Control-Allow-Origin * always;
        }

        # OLD APP
        location / {
            try_files $uri /index.html;
        }

        location /static/ {
            expires 1y;
            add_header Cache-Control "public";
        }

        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root html;
        }
    }
}