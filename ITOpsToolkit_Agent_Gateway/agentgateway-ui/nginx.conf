server {
    listen 19000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    location = /config.json {
        add_header Cache-Control "no-store";
        try_files /config.json =404;
    }
    location = /app-config.json {
        add_header Cache-Control "no-store";
        try_files /app-config.json =404;
    }
    location = / {
        return 302 /ui/;
    }
    location = /ui {
        return 302 /ui/;
    }
    location /ui/ {
        try_files $uri $uri/ /ui/index.html;
    }
    #
    # Existing admin endpoints exposed by Agent Gateway
    #
    location ~ ^/(config_dump|config|logging|memory|cel|debug)(/.*)?$ {
        proxy_pass http://${ENGINE_ADMIN_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    #
    # UI compatibility endpoints - proxy straight through, unmodified
    #
    location = /api/config {
        proxy_pass http://${ENGINE_ADMIN_UPSTREAM}/api/config;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/runtime {
        proxy_pass http://${ENGINE_ADMIN_UPSTREAM}/api/runtime;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/costs/models {
        proxy_pass http://${ENGINE_ADMIN_UPSTREAM}/api/costs/models;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/costs/refresh-base {
        proxy_pass http://${ENGINE_ADMIN_UPSTREAM}/api/costs/refresh-base;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/cel {
        proxy_pass http://${ENGINE_ADMIN_UPSTREAM}/cel;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/logs {
        proxy_pass http://${ENGINE_ADMIN_UPSTREAM}/logging;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
